<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Etymolog">
  <!-- Maskable variant for home-screen installs: the platform may crop the
       outer 10 % on every side into a circle or squircle, so the mark sits
       inside the 80 % safe zone and the background bleeds to the edges. -->
  <rect width="64" height="64" fill="#0e1a1f"/>
  <text x="32" y="41" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Charis SIL', serif"
        font-size="26" font-weight="700" letter-spacing="-1" fill="#fff6dd">Ab</text>
  <rect x="19" y="45" width="26" height="2" rx="1" fill="#bdb37a"/>
</svg>
