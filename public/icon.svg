<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Etymolog">
  <!-- Etymolog mark: "Ab" — the first letters of an alphabet, set as a
       lexicographer's headword on a dark card. Kept to a single glyph pair so
       it still reads at 16 px in a browser tab. Colours are fixed on purpose:
       a favicon has no theme to follow. -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0e1a1f" stroke="#bdb37a" stroke-width="2"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Charis SIL', serif"
        font-size="34" font-weight="700" letter-spacing="-1" fill="#fff6dd">Ab</text>
  <rect x="14" y="50" width="36" height="2.5" rx="1.25" fill="#bdb37a"/>
</svg>
